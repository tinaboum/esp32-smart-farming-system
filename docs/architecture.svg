<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520">
  <defs>
    <style>
      .title { font: 700 25px 'DejaVu Sans', sans-serif; fill: #132238; }
      .layer { font: 700 19px 'DejaVu Sans', sans-serif; fill: #8F2850; letter-spacing: 1.2px; }
      .node { font: 700 21px 'DejaVu Sans', sans-serif; fill: #132238; }
      .detail { font: 400 17px 'DejaVu Sans', sans-serif; fill: #34445A; }
      .label { font: 700 16px 'DejaVu Sans', sans-serif; fill: #237C86; }
      .note { font: 400 16px 'DejaVu Sans', sans-serif; fill: #6E7B8E; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#237C86"/>
    </marker>
  </defs>

  <rect width="1800" height="520" fill="#FFFFFF"/>

  <text x="42" y="42" class="layer">SENSING LAYER</text>
  <rect x="35" y="62" width="360" height="390" rx="24" fill="#F4F6F8" stroke="#D8DEE6" stroke-width="3"/>

  <rect x="65" y="93" width="300" height="70" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
  <circle cx="94" cy="128" r="10" fill="#C64372"/>
  <text x="119" y="122" class="node">DHT22</text>
  <text x="119" y="146" class="detail">Temperature + air humidity</text>

  <rect x="65" y="178" width="300" height="70" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
  <circle cx="94" cy="213" r="10" fill="#C64372"/>
  <text x="119" y="207" class="node">Soil moisture</text>
  <text x="119" y="231" class="detail">Analog measurement</text>

  <rect x="65" y="263" width="300" height="70" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
  <circle cx="94" cy="298" r="10" fill="#C64372"/>
  <text x="119" y="292" class="node">Water level</text>
  <text x="119" y="316" class="detail">Reservoir-state input</text>

  <rect x="65" y="348" width="300" height="70" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
  <circle cx="94" cy="383" r="10" fill="#C64372"/>
  <text x="119" y="377" class="node">PIR + LDR</text>
  <text x="119" y="401" class="detail">Motion and light inputs</text>

  <text x="515" y="82" class="layer">EMBEDDED CONTROL</text>
  <rect x="505" y="102" width="465" height="315" rx="26" fill="#FCF1F5" stroke="#C64372" stroke-width="4"/>
  <text x="550" y="151" class="title">ESP32 LOCAL CONTROLLER</text>
  <line x1="550" y1="168" x2="925" y2="168" stroke="#D8DEE6" stroke-width="2"/>
  <circle cx="566" cy="201" r="5" fill="#8F2850"/><text x="584" y="207" class="detail">Acquire and validate sensor data</text>
  <circle cx="566" cy="240" r="5" fill="#8F2850"/><text x="584" y="246" class="detail">Evaluate thresholds and local rules</text>
  <circle cx="566" cy="279" r="5" fill="#8F2850"/><text x="584" y="285" class="detail">Execute bounded pump timing</text>
  <circle cx="566" cy="318" r="5" fill="#8F2850"/><text x="584" y="324" class="detail">Drive buzzer and status output</text>
  <circle cx="566" cy="357" r="5" fill="#8F2850"/><text x="584" y="363" class="detail">Publish telemetry through Wi-Fi</text>
  <text x="552" y="392" class="note">Local control remains available</text>
  <text x="552" y="414" class="note">if cloud access is interrupted.</text>

  <path d="M395 255 H495" fill="none" stroke="#237C86" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="411" y="239" class="label">GPIO / ADC</text>

  <text x="1082" y="42" class="layer">LOCAL ACTUATION</text>
  <rect x="1075" y="62" width="680" height="172" rx="24" fill="#F4F6F8" stroke="#D8DEE6" stroke-width="3"/>
  <rect x="1110" y="101" width="185" height="92" rx="15" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
  <text x="1202" y="137" text-anchor="middle" class="node">DC pump</text>
  <text x="1202" y="166" text-anchor="middle" class="detail">Timed irrigation</text>
  <rect x="1320" y="101" width="185" height="92" rx="15" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
  <text x="1412" y="137" text-anchor="middle" class="node">Status LED</text>
  <text x="1412" y="166" text-anchor="middle" class="detail">Humidity rule</text>
  <rect x="1530" y="101" width="185" height="92" rx="15" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
  <text x="1622" y="137" text-anchor="middle" class="node">Buzzer</text>
  <text x="1622" y="166" text-anchor="middle" class="detail">PIR/LDR condition</text>

  <path d="M970 171 H1065" fill="none" stroke="#237C86" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="981" y="153" class="label">LOCAL RULES</text>

  <text x="1082" y="292" class="layer">CONNECTED MONITORING</text>
  <rect x="1075" y="312" width="680" height="140" rx="24" fill="#F4F6F8" stroke="#D8DEE6" stroke-width="3"/>
  <rect x="1110" y="344" width="250" height="78" rx="15" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
  <text x="1235" y="376" text-anchor="middle" class="node">Firebase RTDB</text>
  <text x="1235" y="403" text-anchor="middle" class="detail">h, t, hs, wl values</text>
  <rect x="1470" y="344" width="250" height="78" rx="15" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
  <text x="1595" y="376" text-anchor="middle" class="node">Android dashboard</text>
  <text x="1595" y="403" text-anchor="middle" class="detail">Remote visualization</text>

  <path d="M970 350 H1065" fill="none" stroke="#237C86" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="976" y="333" class="label">WI-FI TELEMETRY</text>
  <path d="M1360 383 H1460" fill="none" stroke="#237C86" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1372" y="365" class="label">REAL-TIME DATA</text>
</svg>
